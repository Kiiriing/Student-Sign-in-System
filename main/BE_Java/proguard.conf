# ============================================================
# ProGuard 混淆配置（Spring Boot 4 / Java 25）
# 只做名称混淆，不裁剪、不优化，避免破坏 Spring 注解扫描与反射
# ============================================================
-dontshrink
-dontoptimize
-dontnote
-dontwarn

# 保留注解、泛型签名、内部类、record 等元数据，Spring / Jackson 依赖
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,MethodParameters,Record,Exceptions,SourceFile,LineNumberTable

# 启动类入口
-keep public class com.stu.signin.StudentSigninApplication {
    public static void main(java.lang.String[]);
}

# Spring 托管的组件保留类名（组件扫描、代理、日志定位），成员名仍参与混淆
-keepnames @org.springframework.stereotype.Component class *
-keepnames @org.springframework.stereotype.Service class *
-keepnames @org.springframework.stereotype.Repository class *
-keepnames @org.springframework.stereotype.Controller class *
-keepnames @org.springframework.web.bind.annotation.RestController class *
-keepnames @org.springframework.context.annotation.Configuration class *
-keepnames @org.springframework.boot.context.properties.ConfigurationProperties class *

# record 的组件名会被 Jackson / 配置绑定按名反射，必须整体保留
-keep class * extends java.lang.Record { *; }

# 枚举的 values()/valueOf() 与常量名
-keep enum * { *; }

# 自定义异常类保留类名，便于日志定位
-keepnames class * extends java.lang.Exception
